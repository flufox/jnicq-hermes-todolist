name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17.1
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: python -m unittest discover -s hermes_todo_plugin -p "test_*.py"
      - run: python scripts/release_allowlist.py

  hermes-0160:
    runs-on: ubuntu-24.04
    env:
      HERMES_TODO_API_URL: https://todo.example.invalid
      HERMES_TODO_API_TOKEN: ht_ci_contract_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - run: python -m pip install "hermes-agent==0.16.0"
      - run: hermes plugins install "file://$GITHUB_WORKSPACE" --enable
      - run: hermes plugins list
      - run: python -m unittest discover -s hermes_todo_plugin -p "test_*.py"
      - run: test "$(grep '^version:' plugin.yaml | awk '{print $2}')" = "0.1.0"

  hermes-main-nonblocking:
    continue-on-error: true
    runs-on: ubuntu-24.04
    env:
      HERMES_TODO_API_URL: https://todo.example.invalid
      HERMES_TODO_API_TOKEN: ht_ci_contract_only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.11" }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: main
          path: .hermes-agent
      - run: python -m pip install -e ./.hermes-agent
      - run: hermes plugins install "file://$GITHUB_WORKSPACE" --enable
      - run: python -m unittest discover -s hermes_todo_plugin -p "test_*.py"
